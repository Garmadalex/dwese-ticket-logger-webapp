<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ticket Logger - Comunidad Autónoma')}"></head>
<body>

<!-- Incluir el fragmento del header -->
<header th:replace="~{fragments/header :: header}"></header>

<main class="container mt-5">
    <h1 th:text="${region.id == null} ? #{msg.region-form.add} : #{msg.region-form.edit}"></h1>

    <!-- Muestra un mensaje de error si hay algún problema -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Si el id es null se inserta; si no, se actualiza -->
    <form th:action="${region.id == null} ? @{/regions/insert} : @{/regions/update}"
          th:object="${region}" method="post" enctype="multipart/form-data" class="mt-3">

        <!-- Campos ocultos: id e imagen actual (para no perderla al editar sin subir otra) -->
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{image}"/>

        <div class="mb-3">
            <label for="code" class="form-label" th:text="#{msg.region-form.code}"></label>
            <input type="text" id="code" th:field="*{code}" class="form-control"
                   th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label" th:text="#{msg.region-form.name}"></label>
            <input type="text" id="name" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <!-- Imagen actual, si existe -->
        <div class="mb-3">
            <img th:if="${region.image != null and !region.image.isEmpty()}"
                 th:src="@{/uploads/{img}(img=${region.image})}" alt="" class="img-thumbnail"
                 style="max-height: 150px;"/>
            <p th:unless="${region.image != null and !region.image.isEmpty()}"
               class="text-muted" th:text="#{msg.region.noImage}"></p>
        </div>

        <div class="mb-3">
            <label for="imageFile" class="form-label" th:text="#{msg.region.image}"></label>
            <input type="file" id="imageFile" name="imageFile" class="form-control" accept="image/*"/>
        </div>

        <button type="submit" class="btn btn-success"
                th:text="${region.id == null} ? #{msg.region-form.create} : #{msg.region-form.update}"></button>
        <a th:href="@{/regions}" class="btn btn-secondary" th:text="#{msg.region-form.returnback}"></a>
    </form>
</main>

<!-- Incluir el fragmento del footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
